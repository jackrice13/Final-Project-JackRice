<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}VulnTracker{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f0f2f5; }
        .navbar { background: linear-gradient(135deg, #1a1f5e 0%, #2d3561 100%); }
        .stat-card { border-radius: 12px; border: none; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .stat-card.total { border-left: 4px solid #4e73df; }
        .stat-card.critical { border-left: 4px solid #e74c3c; }
        .stat-card.high { border-left: 4px solid #e67e22; }
        .stat-card.kev { border-left: 4px solid #8e44ad; }
        .stat-number { font-size: 2rem; font-weight: 700; }
        .stat-label { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; color: #6c757d; }
        .severity-critical { background-color: #e74c3c; color: white; padding: 3px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; }
        .severity-high { background-color: #e67e22; color: white; padding: 3px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; }
        .severity-medium { background-color: #f39c12; color: white; padding: 3px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; }
        .severity-low { background-color: #27ae60; color: white; padding: 3px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; }
        .severity-unknown { background-color: #95a5a6; color: white; padding: 3px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; }
        .kev-badge { background-color: #8e44ad; color: white; padding: 3px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; }
        .filter-card { border-radius: 12px; border: none; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .vuln-table { border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .vuln-table thead { background: linear-gradient(135deg, #1a1f5e 0%, #2d3561 100%); color: white; }
        .vuln-table tbody tr:hover { background-color: #f8f9ff; cursor: pointer; }
        .cve-link { color: #1a1f5e; font-weight: 600; text-decoration: none; }
        .cve-link:hover { color: #4e73df; text-decoration: underline; }
        .vuln-table th, .vuln-table td { vertical-align: middle; }
        .col-cve { width: 140px; }
        .col-severity { width: 90px; }
        .col-score { width: 80px; }
        .col-software { width: 300px; max-width: 300px; overflow: hidden; }
        .col-published { width: 110px; }
        .col-kev { width: 100px; }
        .col-actions { width: 80px; }
        .software-badges { display: flex; flex-wrap: wrap; gap: 4px; max-height: 60px; overflow-y: auto; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark py-3 mb-4">
        <div class="container">
            <span class="navbar-brand fw-bold fs-4">🛡️ VulnTracker</span>
            <div class="d-flex align-items-center gap-3">
                <span class="text-white">Welcome, {{ request.user.username }}</span>
                <a href="{% url 'profile' %}" class="btn btn-outline-light btn-sm">My Profile</a>
                <a href="{% url 'logout' %}" class="btn btn-outline-light btn-sm">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
